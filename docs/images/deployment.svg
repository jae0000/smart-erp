<svg xmlns="http://www.w3.org/2000/svg" width="850" height="510" viewBox="0 0 850 510" role="img" aria-label="다른 Wi-Fi에서 접속하는 배포 구조"><rect width="850" height="510" fill="#f3f6fa"/><g font-family="Apple SD Gothic Neo,Malgun Gothic,sans-serif"><text x="36" y="52" font-size="28" font-weight="bold" fill="#152c49">다른 Wi-Fi에서 접속하는 배포 구조</text>
